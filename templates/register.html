{% extends 'base.html' %}

{% block content %}
<div class="form-container glass-panel" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align: center;">Register</h2>
    <p class="subtitle" style="text-align: center;">Create an account to post alerts</p>

    <form method="POST" action="{{ url_for('register') }}" class="alert-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Create Account</button>
    </form>
</div>
{% endblock %}
