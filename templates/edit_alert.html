{% extends 'base.html' %}

{% block content %}
<div class="form-container glass-panel">
    <h2>Edit Alert Details</h2>
    <p class="subtitle">Update information for {{ alert.name }}</p>

    <form method="POST" action="{{ url_for('edit_alert', id=alert.id) }}" class="alert-form">
        <div class="form-group row">
            <div class="col">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required value="{{ alert.name }}">
            </div>
            <div class="col">
                <label for="age">Age *</label>
                <input type="number" id="age" name="age" required min="1" max="120" value="{{ alert.age }}">
            </div>
        </div>

        <div class="form-group">
            <label>Area (Cannot be changed)</label>
            <input type="text" value="{{ alert.area }}" disabled class="disabled-input">
        </div>

        <div class="form-group">
            <label for="last_seen">Last Seen Location / Details *</label>
            <textarea id="last_seen" name="last_seen" rows="3" required>{{ alert.last_seen }}</textarea>
        </div>

        <div class="form-group">
            <label for="contact">Contact Number *</label>
            <input type="tel" id="contact" name="contact" required value="{{ alert.contact }}">
        </div>

        <div class="form-actions">
            <a href="{{ url_for('view_alerts') }}" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Update Alert</button>
        </div>
    </form>
</div>
{% endblock %}
