{% extends 'base.html' %}

{% block content %}
<div class="form-container glass-panel" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align: center;">Login</h2>
    <p class="subtitle" style="text-align: center;">Access your account to manage alerts</p>

    <form method="POST" action="{{ url_for('login') }}" class="alert-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Login</button>
        
        <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
            Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent); text-decoration: none;">Register here</a>
        </p>
    </form>
</div>
{% endblock %}
